name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write   # required for NuGet Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Restore strong-name key
        shell: pwsh
        env:
          DHWIFICLIENT_STRONG_NAME_KEY_BASE64: ${{ secrets.DHWIFICLIENT_STRONG_NAME_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DHWIFICLIENT_STRONG_NAME_KEY_BASE64)) {
            throw "GitHub secret DHWIFICLIENT_STRONG_NAME_KEY_BASE64 is required."
          }

          $keyDir = Join-Path $env:GITHUB_WORKSPACE ".keys"
          $keyPath = Join-Path $keyDir "DHWifiClient.NET.snk"

          New-Item -ItemType Directory -Force -Path $keyDir | Out-Null
          [System.IO.File]::WriteAllBytes(
            $keyPath,
            [System.Convert]::FromBase64String($env:DHWIFICLIENT_STRONG_NAME_KEY_BASE64)
          )

      - name: Restore
        run: dotnet restore DHWifiClientSol/lib/DHWifiClient.NET/DHWifiClient.NET.csproj

      - name: Pack
        run: dotnet pack DHWifiClientSol/lib/DHWifiClient.NET/DHWifiClient.NET.csproj -c Release --no-restore

      - name: List packed output (diagnostic)
        run: Get-ChildItem -Recurse DHWifiClientSol/lib/DHWifiClient.NET/bin/Release

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: cyberkdh

      - name: Push to NuGet.org
        run: dotnet nuget push DHWifiClientSol\lib\DHWifiClient.NET\bin\Release\*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: DHWifiClientSol/lib/DHWifiClient.NET/bin/Release/*.nupkg
